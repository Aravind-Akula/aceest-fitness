name: CI

on:
  push:
  pull_request:

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Lint
        run: flake8 app.py tests --max-line-length=100

  docker-test:
    name: Docker Build & Test
    needs: build-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t aceest-fitness:ci .
      - name: Run Pytest inside container
        run: docker run --rm aceest-fitness:ci pytest -v
